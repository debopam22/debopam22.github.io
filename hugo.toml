[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

# Customization options
[params]

    [params.head]
        author = "Debopam Goswami"
        custom_css = "/custom.css"
        description = "Graduate Researcher at Mitchell Institute of Fundamental Physics and Astronomy, Texas A&M university"
        keywords = ["physics", "machine learning", "PhD"]

    [params.navigation]
        show_navigation = true

    [params.footer]
        show_footer = true

    [params.typography]
        title_font = "Bree Serif"
        body_font = "Source Sans Pro"

    [params.colors]
        theme_color = "#333333"
        background_color = "#f0e1ca"    #"#fcfbf9"
        text_color = "#333333"
        link_color = "#8b0000"

    [params.social]
        [params.social.email]
            name = "E-Mail"
            class = "fas fa-envelope"
            url = "mailto:debopam22@tamu.edu"
            weight = 1
        [params.social.linkedin]
            name = "LinkedIn"
            class = "fab fa-linkedin"
            url = "https://www.linkedin.com/in/debopam-goswami/"
            weight = 2
        [params.social.github]
            name = "GitHub"
            class = "fab fa-github"
            url = "https://github.com/debopam22"
            weight = 3
        [params.social.google_scholar]
            name = "Google Scholar"
            class = "ai ai-google-scholar"
            url = "https://scholar.google.com/citations?user=k5ZqTUwAAAAJ&hl=en"
            weight = 4
